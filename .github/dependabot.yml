# Weekly dependency updates (security.md, "Dependencies"). Grouped so a week's bumps arrive
# as one PR per ecosystem; each PR runs CI, and xray's own report, before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        # Majors get their own PR (jscpd 4 → 5 broke the grouped one, #13).
        update-types: ["minor", "patch"]
    ignore:
      # ADR-0002: TypeScript 7 has no JavaScript API; dependency-cruiser and ts-morph need 6.x.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
