# Dogfooding: runs this repository's own action on its pull requests.
name: xray

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # xray needs the base branch to find the merge base
      - uses: ./
