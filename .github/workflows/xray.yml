# Dogfooding: runs this repository's own action on its pull requests.
name: xray

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # xray needs the base branch to find the merge base
      - uses: ./
