name: xray PR analysis
description: Analyse a TypeScript/React pull request and publish the report as a single, updated comment.
branding:
  icon: activity
  color: blue

inputs:
  base:
    description: Base branch to compare against. Defaults to the PR's target branch.
    required: false
    default: ${{ github.base_ref }}
  working-directory:
    description: Root of the project to analyse, relative to the workspace.
    required: false
    default: .
  config:
    description: Path to the xray config, relative to working-directory. Defaults to xray.config.json.
    required: false
    default: ""
  bundle:
    description: >-
      Also measure bundle size: installs dependencies and runs the build on the base and on the PR
      (minutes, and it runs the project's scripts). Set to "true" to enable.
    required: false
    default: "false"
  comment:
    description: Publish the report as a PR comment. Set to "false" to only produce the file.
    required: false
    default: "true"
  github-token:
    description: Token used to write the comment. Needs pull-requests write permission.
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: Path of the generated Markdown report.
    value: ${{ steps.analyse.outputs.report-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        # Never cache the analysed repo's package manager store from inside xray's Action.
        package-manager-cache: false

    - name: Build xray
      shell: bash
      working-directory: ${{ github.action_path }}
      # Only what a PR run needs: the quality tool and its UI (React, Vite, pulp) stay out (ADR-0014).
      run: |
        npm ci --no-audit --no-fund --include-workspace-root --workspace @xray/core --workspace @xray/cli --workspace @xray/action
        npm run build:action

    - name: Analyse
      id: analyse
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        XRAY_BASE: ${{ inputs.base }}
        XRAY_CONFIG: ${{ inputs.config }}
        # A PR checkout is GitHub's temporary merge commit; report the PR's own head instead.
        XRAY_HEAD: ${{ github.event.pull_request.head.sha }}
        XRAY_BUNDLE: ${{ inputs.bundle }}
        XRAY_CLI: ${{ github.action_path }}/packages/cli/dist/index.js
      run: |
        report="$RUNNER_TEMP/xray-report.md"
        args=("$XRAY_BASE" --out "$report")
        if [ -n "$XRAY_CONFIG" ]; then args+=(--config "$XRAY_CONFIG"); fi
        if [ -n "$XRAY_HEAD" ]; then args+=(--head "$XRAY_HEAD"); fi
        if [ "$XRAY_BUNDLE" = "true" ]; then
          # pnpm and yarn projects: corepack provides the version their package.json pins.
          corepack enable >/dev/null 2>&1 || true
          args+=(--bundle)
        fi
        node "$XRAY_CLI" "${args[@]}"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "report-path=$report" >> "$GITHUB_OUTPUT"

    - name: Comment on the PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "${{ github.action_path }}/packages/action/dist/index.js" "${{ steps.analyse.outputs.report-path }}"
